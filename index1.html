<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
 <title>SmartRecipeFinder</title>
     <link rel="icon"  href="hey.icon.png">
    <link rel="stylesheet" href="index1.css">
</head>

<body>

    <div class="page">

        <!-- LEFT INGREDIENT PANEL -->
        <aside class="ingredients">

            <h2>Ingredients</h2>

            <h3>Vegetables</h3>
            <label><input type="checkbox"> Tomato</label>
            <label><input type="checkbox"> Onion</label>
            <label><input type="checkbox"> Potato</label>

            <h3>Dairy</h3>
            <label><input type="checkbox"> Milk</label>
            <label><input type="checkbox"> Curd</label>
            <label><input type="checkbox"> Paneer</label>

            <h3>Fruits</h3>
            <label><input type="checkbox"> Apple</label>
            <label><input type="checkbox"> Banana</label>
            <label><input type="checkbox"> Mango</label>

            <h3>Grains & Pulses</h3>
            <label><input type="checkbox"> Rice</label>
            <label><input type="checkbox"> Ragi</label>
            <label><input type="checkbox"> Oats</label>

            <button>OK</button>

        </aside>


        <!-- RIGHT SIDE -->
        <main class="main-content">

            <h1>Smart Recipe Finder</h1>

            <!-- SEARCH -->
            <div class="search-box">
                <input type="text" placeholder="I want to cook...">
                <button>Search</button>
            </div>


            <!-- NAVIGATION -->
            <nav class="categories">

                <button>🍳 Breakfast</button>
                <button>🍛 Lunch</button>
                <button>🌙 Dinner</button>
                <button>🍟 Snacks</button>
                <button>🍰 Desserts</button>

                <button>🥗 Healthy</button>
                <button>🌱 Vegetarian</button>
                <button>🍗 Non-Vegetarian</button>
                <button>🌴 South Indian</button>
                <button>🥤 Drinks</button>

            </nav>
            <h2>🍳 Breakfast</h2>


        </main>

    </div>

</body>
</html>
